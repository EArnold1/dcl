[package]
name = "dcl"
version = "0.1.0"
edition = "2024"
authors = [
"Arnold Emmanuel <arnoldemmanuel15@gmail.com>" # https://github.com/EArnold1
]
description = "dcl is a Rust based CLI tool for creating ready-to-use local clones of development projects by copying, symlinking, and ignoring files and directories according to configurable rules."

[[bin]]
name = "dcl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
comfy-table = "8.0.0"
dirs = "6.0.0"
globset = "0.4.14"
rayon = "1.8.0"
serde = {version ="1.0.229", features = ["derive"]}
tar = "0.4"
thiserror = "2.0.19"
toml = "1.1.4"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.dist]
dist = true
