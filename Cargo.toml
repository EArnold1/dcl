[package]
name = "dcl"
version = "0.1.0"
edition = "2024"
authors = [
"Arnold Emmanuel <arnoldemmanuel15@gmail.com>" # https://github.com/EArnold1
]
description = "dcl is a Rust based CLI tool for creating ready-to-use local clones of development projects by copying, symlinking, and ignoring files and directories according to configurable rules."


[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
dirs = "6.0.0"
globset = "0.4.14"
rayon = "1.8.0"
serde = {version ="1.0.229", features = ["derive"]}
thiserror = "2.0.19"
toml = "1.1.4"

[dev-dependencies]
tempfile = "3.27.0"
