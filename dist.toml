# cargo-dist configuration file
[workspace]

[package.dcl]
# Generate installers for each platform
installers = ["shell", "powershell"]

# Generate tarballs/zips for each platform
auto-include-files = ["README.md", "LICENSE"]

# Define target platforms
[dist.targets.aarch64-apple-darwin]
[dist.targets.x86_64-apple-darwin]
[dist.targets.x86_64-unknown-linux-gnu]
[dist.targets.aarch64-unknown-linux-gnu]
[dist.targets.x86_64-pc-windows-msvc]
