name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage package
        shell: bash
        run: |
          staging="dcl-${{ matrix.target }}"
          mkdir -p "$staging"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/dcl.exe" "$staging/"
          else
            cp "target/${{ matrix.target }}/release/dcl" "$staging/"
          fi
          cp README.md LICENSE "$staging/"
          echo "STAGING=$staging" >> "$GITHUB_ENV"

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar czf "${STAGING}.tar.gz" "${STAGING}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${STAGING}.tar.gz" > "${STAGING}.tar.gz.sha256"
          else
            shasum -a 256 "${STAGING}.tar.gz" > "${STAGING}.tar.gz.sha256"
          fi

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "${env:STAGING}" -DestinationPath "${env:STAGING}.zip"
          $hash = Get-FileHash -Algorithm SHA256 -Path "${env:STAGING}.zip"
          "$($hash.Hash.ToLower())  ${env:STAGING}.zip" | Out-File -Encoding ascii "${env:STAGING}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcl-${{ matrix.target }}
          path: dcl-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: EArnold1/homebrew-dcl
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARM_SHA=$(cut -d ' ' -f1 artifacts/dcl-aarch64-apple-darwin.tar.gz.sha256)
          INTEL_SHA=$(cut -d ' ' -f1 artifacts/dcl-x86_64-apple-darwin.tar.gz.sha256)
          ARM_URL="https://github.com/EArnold1/dcl/releases/download/${GITHUB_REF_NAME}/dcl-aarch64-apple-darwin.tar.gz"
          INTEL_URL="https://github.com/EArnold1/dcl/releases/download/${GITHUB_REF_NAME}/dcl-x86_64-apple-darwin.tar.gz"

          python3 - "$VERSION" "$ARM_URL" "$ARM_SHA" "$INTEL_URL" "$INTEL_SHA" <<'EOF'
          import sys, re, pathlib
          version, arm_url, arm_sha, intel_url, intel_sha = sys.argv[1:6]
          path = pathlib.Path("tap/Formula/dcl.rb")
          text = path.read_text()
          text = re.sub(r'version ".*"', f'version "{version}"', text, count=1)

          def sub_block(text, marker, url, sha):
              pattern = re.compile(
                  rf'(on_{marker} do\n\s*url ").*?("\n\s*sha256 ").*?(")',
                  re.S,
              )
              return pattern.sub(lambda m: f"{m.group(1)}{url}{m.group(2)}{sha}{m.group(3)}", text, count=1)

          text = sub_block(text, "arm", arm_url, arm_sha)
          text = sub_block(text, "intel", intel_url, intel_sha)
          path.write_text(text)
          EOF

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dcl.rb
          git diff --cached --quiet && exit 0
          git commit -m "dcl ${GITHUB_REF_NAME#v}"
          git push
